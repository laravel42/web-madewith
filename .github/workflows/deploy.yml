name: Deploy to Cloudflare Pages

# Builds the static site and deploys it to Cloudflare Pages on every push to the
# default branch (and on demand). Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN  — a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID — your Cloudflare account id
# Create the Pages project once (name must match wrangler.jsonc → "madewith-catalog"),
# or let the first deploy create it via direct upload.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Refresh data at deploy time too (uses the built-in token → GraphQL path).
      - name: Scrape latest GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run scrape

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=madewith-catalog
